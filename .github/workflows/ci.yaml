# Oddsmaker - CI/CD Pipeline
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '21'

jobs:
  # Job 1: Build and Test (Java services)
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build and test（走仓库 wrapper，与 nightly/release 同一 Gradle 版本真源）
        uses: gradle/gradle-build-action@v3
        with:
          arguments: |
            --no-daemon
            --stacktrace
            :services:control-service:test
            :services:gateway-service:test

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/'

  # Job 2: Build and test Web SDK
  build-web-sdk:
    name: Build Web SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci || npm i
      - run: npm run build
      - name: Run Web SDK consistency tests
        run: npm run test:hash

  # 镜像推送已从本流水线移出，统一由两处负责，避免同一 :latest 由两条链路竞争：
  #   - nightly-build.yml → ghcr.io/cuihairu/oddsmaker:nightly（每日 cron + main 推送）
  #   - release.yaml      → ghcr.io/cuihairu/oddsmaker:<version>/<major.minor>/<major>/latest（v* tag）
  # 本流水线只做校验（Java 服务测试 + Web SDK 构建/一致性测试）。
