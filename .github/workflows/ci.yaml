# Oddsmaker - CI/CD Pipeline
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'

env:
  JAVA_VERSION: '21'

jobs:
  # Job 1: Build and Test (Java services)
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # 全模块 test（与 nightly 同一条命令）：此前只跑 control/gateway 两模块（2243 例），
      # 其余 13 个模块 493 例（agent 211 / Flink 七作业 257 / sdks-server 8 / libs/common-* 17）
      # 只在 nightly 跑——改坏它们的提交在 CI 上绿、到夜里才红（与 ml、web 缺门一族）。
      - name: Build and test（走仓库 wrapper，与 nightly/release 同一 Gradle 版本真源）
        uses: gradle/gradle-build-action@v3
        with:
          arguments: |
            --no-daemon
            --stacktrace
            test

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/'

  # Job 2: Build and test Web SDK
  build-web-sdk:
    name: Build Web SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci || npm i
      - run: npm run build
      # 全量三套（test:hash + test:game + test:src 的 node --test）：此前只跑 test:hash，
      # test:game 与 test:src（含 1009ecb 补的桶文件导出断言）在 CI 上从未执行。
      - name: Run Web SDK tests
        run: npm test

  # Job 3: ML 训练管线测试（Python，离线合成数据不联网；依赖以 ml/pyproject.toml 为单一真源）
  ml-tests:
    name: ML pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run ML pipeline tests
        run: python -m pytest

  # Job 4: Web 控制台测试（web/ vitest，198+ 例）
  # 此前只由 nightly 跑：push/PR 阶段无门，改坏 web/ 的提交在 CI 上是绿的、到夜里才红。
  web-console-tests:
    name: Web Console tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm 必须先于 setup-node 安装：cache: 'pnpm' 会执行 pnpm store path，pnpm 不在 PATH 时 setup-node 直接失败
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Run tests
        run: pnpm -C web test

      - name: Build (verify compile)
        run: pnpm -C web build

  # 镜像推送已从本流水线移出，统一由两处负责，避免同一 :latest 由两条链路竞争：
  #   - nightly-build.yml → ghcr.io/cuihairu/oddsmaker:nightly（每日 cron + main 推送）
  #   - release.yaml      → ghcr.io/cuihairu/oddsmaker:<version>/<major.minor>/<major>/latest（v* tag）
  # 本流水线只做校验（Java 全模块测试 + Web SDK 构建/全量测试 + ML 训练管线测试 + Web 控制台测试）。
