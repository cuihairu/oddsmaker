# Oddsmaker 演示站点部署腿：GHCR nightly 镜像 → runner-docker 机 compose 拉起 → 健康检查 → 失败回滚
#
# 触发：Nightly Build 成功后自动跟进（workflow_run），或手动 workflow_dispatch。
# 形态（cockpit 同款）：web 构建在 GitHub-hosted runner 完成（vite build 内存峰值
# 不落在 1.6G 的部署机上），self-hosted runner 只做下载/拉镜像/起栈/探活。
#
# 部署机约定（/opt/oddsmaker）：docker-compose.yml + .env 已就位（首次由人工执行，
# 见 deploy/demo/README 注释），本工作流只滚动镜像与 web 静态资源。

name: Deploy Demo

on:
  workflow_run:
    workflows: ["Nightly Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # 拉本仓 GHCR 镜像

concurrency:
  group: deploy-demo
  cancel-in-progress: false  # 部署不并发：滚动镜像 + 回滚依赖串行状态

jobs:
  # ============================================================
  # Job 1: 构建 Web 控制台静态资源（GitHub-hosted，产出 artifact）
  # ============================================================
  build-web:
    name: Build Web Console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # pnpm 必须先于 setup-node 安装：cache: 'pnpm' 需要 pnpm 在 PATH（同 nightly-build 的坑）
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12
          run_install: false

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Build web console
        run: pnpm -C web build

      - name: Upload web dist
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1
          if-no-files-found: error

  # ============================================================
  # Job 2: 部署到 runner-docker（拉镜像 → 起栈 → 探活 → 失败回滚）
  # ============================================================
  deploy:
    name: Deploy to runner-docker
    needs: build-web
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, runner-docker]
    # 这条腿串了 pull 重试（3×15s）、慢宿主上的镜像解包与冷启动、探活、以及失败回滚探活；
    # 15 分钟会被前段吃光，回滚腿还没跑完就被掐（2026-10-14 实测）。
    timeout-minutes: 30
    env:
      DEMO_HOME: /opt/oddsmaker
      IMAGE: ghcr.io/cuihairu/oddsmaker:nightly
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download web dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: web-dist

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 编排文件以仓库为准：只改仓库不同步部署机，下一次重建会带着过期环境变量起来
      # （如新增 ODDSMAKER_WEB_CORS_ALLOWED_ORIGINS 时，浏览器登录 403 却查不到配置来源）。
      # .env 是机器本地机密（口令/token/JWT 密钥），不同步、也不进仓库。
      - name: Sync compose file from repo
        run: |
          set -euo pipefail
          install -m 0644 deploy/demo/docker-compose.yml "$DEMO_HOME/docker-compose.yml"
          docker compose -f "$DEMO_HOME/docker-compose.yml" --env-file "$DEMO_HOME/.env" config -q

      - name: Pull nightly image
        run: |
          # PREV_DIGEST 必须在 pull 前捕获：pull 会把 :nightly 移到新镜像，之后再
          # inspect 拿到的是新 digest，回滚腿会拉回同一个坏镜像空转（等于没回滚）。
          # 记的就是「当前在跑的上一版」；首次部署无本地镜像则留空，回滚步自动跳过。
          echo "PREV_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null || true)" >> "$GITHUB_ENV"
          # GHCR 拉取在部署机上偶发 TLS handshake timeout（网络抖动），重试 3 次
          for i in 1 2 3; do
            if docker pull "$IMAGE"; then
              exit 0
            fi
            echo "pull attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::docker pull failed after 3 attempts"
          exit 1

      - name: Deploy stack and verify health
        run: |
          set -euo pipefail
          cd "$DEMO_HOME"

          docker compose up -d

          # 预算分两段：compose up 在慢宿主上可能先解包镜像数分钟（2026-10-14 实测 ~4 分钟），
          # 这段编排杂务不应吃掉应用冷启动的探活预算——先等 control-service 真正 Running（段一），
          # 再开始健康探活（段二）。应用若真起不来，段二到期打印 ps+logs 并触发回滚腿。
          phase_deadline=$((SECONDS + 600))
          until [ -n "$(docker compose ps --status running -q control-service)" ]; do
            if [ "$SECONDS" -ge "$phase_deadline" ]; then
              echo "::error::container never reached running state"; docker compose ps; docker compose logs --tail 50 control-service
              exit 1
            fi
            sleep 5
          done

          # 健康门槛：/actuator/health 是 permitAll；Boot 4 + Hibernate 7 在 1.6G 宿主冷启动
          # 实测 300s 不够（探针到期时仍在 JPA 初始化中段），给 10 分钟
          deadline=$((SECONDS + 600))
          until curl -fsS http://127.0.0.1:"${CONTROL_PORT:-38085}"/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::health check timeout"; docker compose ps; docker compose logs --tail 50 control-service
              exit 1
            fi
            sleep 5
          done
          echo "stack healthy"

      - name: Publish web console (atomic swap)
        run: |
          set -euo pipefail
          # 先落新目录再原子换名：nginx 读到的一直是完整的一份
          rm -rf "$DEMO_HOME/web.next"
          mkdir -p "$DEMO_HOME/web.next"
          cp -a web-dist/. "$DEMO_HOME/web.next/"
          rm -rf "$DEMO_HOME/web.prev"
          [ -d "$DEMO_HOME/web" ] && mv "$DEMO_HOME/web" "$DEMO_HOME/web.prev"
          mv "$DEMO_HOME/web.next" "$DEMO_HOME/web"
          echo "web published"

      - name: Record last-good digest
        if: success()
        run: |
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > "$DEMO_HOME/.last-good-digest"
          cat "$DEMO_HOME/.last-good-digest"

      # 回滚：镜像退回上一个 digest 后重启栈；web 静态资源无状态依赖，保留新版即可
      - name: Rollback on failure
        if: failure()
        run: |
          set -u
          cd "$DEMO_HOME"
          if [ -z "${PREV_DIGEST:-}" ]; then
            echo "no previous digest recorded, skip rollback"
            exit 0
          fi
          echo "rolling back to $PREV_DIGEST"
          docker pull "$PREV_DIGEST"
          docker tag "$PREV_DIGEST" "$IMAGE"
          # 重指同名 tag 后 compose 不会主动重建（实测容器保持 Running，回滚等于没生效），
          # 必须显式 force-recreate；只动 control-service，不弹 PG/Redis
          docker compose up -d --force-recreate control-service
          deadline=$((SECONDS + 600))
          until curl -fsS http://127.0.0.1:"${CONTROL_PORT:-38085}"/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::rollback still unhealthy"; exit 1; fi
            sleep 5
          done
          echo "rolled back to last-good digest"
          exit 1  # 回滚成功也标记部署失败，让本次变更可见

  # 假绿哨兵：上游 Nightly 失败时 deploy job 被 if 跳过，而 workflow_run 触发的
  # run 仍报 success——「Deploy Demo 绿」会被读成「部署成功」，实际什么都没部署
  # （2026-10-14 实测 38517953004：deploy=skipped、run=success，误导了排障方向）。
  # 该哨兵只在 deploy 被跳过时显式变红：Deploy Demo 绿 = 真的部署过且健康。
  no-deploy:
    name: No deploy performed
    needs: [build-web, deploy]
    if: always() && needs.deploy.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Fail because nothing was deployed
        run: |
          echo "::error::上游 Nightly 结论为 '${{ github.event.workflow_run.conclusion }}'，deploy job 被跳过，本次未部署任何东西"
          exit 1
