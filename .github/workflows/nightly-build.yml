# Oddsmaker Nightly Build — 每日滚动 Release（falcon 形态标杆）
# 触发：每日 UTC 00:00 / main 推送 / 手动派发
# 交付：Releases 页固定 tag=nightly（prerelease），仅认 Release 页产物（Actions artifacts 不算交付）
# 产物矩阵：Linux x64/arm64、macOS x64/arm64、Windows x64（服务端全套 + BUILD_INFO），附 VERIFY.md(SHA256)

name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'  # 每日 UTC 00:00
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # 必须显式声明，默认 GITHUB_TOKEN 只读会导致创建 Release 403

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oddsmaker

jobs:
  # ============================================================
  # Job 1: Full Test Suite (must pass before any build)
  # ============================================================
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Run Java tests (all modules)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: |
            --no-daemon
            --stacktrace
            test

      - name: Upload Java test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: java-test-results
          path: '**/build/reports/tests/'

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Web SDK dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Run Web SDK tests
        run: pnpm -C web test

      - name: Build Web SDK (verify compile)
        run: pnpm -C web build

      - name: Upload Web test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-test-results
          path: 'web/coverage/'

  # ============================================================
  # Job 2: Multi-platform Build (needs test to pass)
  # ============================================================
  build:
    name: Build ${{ matrix.os-name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
            os-name: linux-x64
            artifact-name: oddsmaker-server-linux-x64
            package-ext: tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            os-name: linux-arm64
            artifact-name: oddsmaker-server-linux-arm64
            package-ext: tar.gz
          - runner: macos-15-intel
            os: macos
            arch: x64
            os-name: macos-x64
            artifact-name: oddsmaker-server-macos-x64
            package-ext: tar.gz
          - runner: macos-15
            os: macos
            arch: arm64
            os-name: macos-arm64
            artifact-name: oddsmaker-server-macos-arm64
            package-ext: tar.gz
          - runner: windows-latest
            os: windows
            arch: x64
            os-name: windows-x64
            artifact-name: oddsmaker-server-windows-x64
            package-ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Web SDK dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Build Web SDK
        run: pnpm -C web build

      - name: Build all Java modules (bootJar + fatJars + agent)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: |
            --no-daemon
            --stacktrace
            :services:control-service:bootJar
            :services:gateway-service:bootJar
            :jobs:flink:events-enrich-job:fatJar
            :jobs:flink:sessions-job:fatJar
            :jobs:flink:retention-job:fatJar
            :jobs:flink:funnels-job:fatJar
            :jobs:flink:risk-job:fatJar
            :jobs:flink:identity-merge-job:fatJar
            :jobs:flink:dimension-sync-job:fatJar
            :agents:dimension-sync-agent:installDist

      - name: Prepare distribution directory
        shell: bash
        run: |
          set -euo pipefail
          VERSION="nightly-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          DIST_DIR="dist/${{ matrix.artifact-name }}"
          mkdir -p "$DIST_DIR"/{bin,conf,lib,jars,web}

          # Control & Gateway bootJars
          cp services/control-service/build/libs/*-all.jar "$DIST_DIR/lib/control-service.jar" 2>/dev/null || \
            cp services/control-service/build/libs/*.jar "$DIST_DIR/lib/control-service.jar"
          cp services/gateway-service/build/libs/*-all.jar "$DIST_DIR/lib/gateway-service.jar" 2>/dev/null || \
            cp services/gateway-service/build/libs/*.jar "$DIST_DIR/lib/gateway-service.jar"

          # Flink job fatJars (6 jobs)
          cp jobs/flink/events-enrich-job/build/libs/*-all.jar "$DIST_DIR/jars/events-enrich-job.jar"
          cp jobs/flink/sessions-job/build/libs/*-all.jar "$DIST_DIR/jars/sessions-job.jar"
          cp jobs/flink/retention-job/build/libs/*-all.jar "$DIST_DIR/jars/retention-job.jar"
          cp jobs/flink/funnels-job/build/libs/*-all.jar "$DIST_DIR/jars/funnels-job.jar"
          cp jobs/flink/risk-job/build/libs/*-all.jar "$DIST_DIR/jars/risk-job.jar"
          cp jobs/flink/identity-merge-job/build/libs/*-all.jar "$DIST_DIR/jars/identity-merge-job.jar"

          # Dimension sync agent (installDist output)
          cp -r agents/dimension-sync-agent/build/install/dimension-sync-agent/* "$DIST_DIR/"

          # Web console static assets
          cp -r web/dist/* "$DIST_DIR/web/" 2>/dev/null || true

          # Startup scripts
          cp docker/entrypoint.sh "$DIST_DIR/bin/entrypoint.sh"
          chmod +x "$DIST_DIR/bin/entrypoint.sh"
          # Windows batch wrapper (use printf to avoid YAML parsing issues with @)
          printf '@echo off\r\nset SERVICE=%%SERVICE%%\r\nif "%%SERVICE%%"=="" set SERVICE=control\r\nset JAR_FILE=\r\nif "%%SERVICE%%"=="control" set JAR_FILE=..\lib\control-service.jar\r\nif "%%SERVICE%%"=="gateway" set JAR_FILE=..\lib\gateway-service.jar\r\nif "%%JAR_FILE%%"=="" (\r\n  echo ERROR: Unknown SERVICE=%%SERVICE%%. Valid values: control, gateway\r\n  exit /b 1\r\n)\r\njava %%JAVA_OPTS%% -jar "%%JAR_FILE%%" --spring.config.additional-location=optional:file:..\conf\,optional:file:..\conf\\r\n' > "$DIST_DIR/bin/entrypoint.bat"

          # Config templates
          cp services/control-service/src/main/resources/application.yaml "$DIST_DIR/conf/control-application.yaml"
          cp services/gateway-service/src/main/resources/application.yaml "$DIST_DIR/conf/gateway-application.yaml"

          # BUILD_INFO (use printf to avoid heredoc issues in YAML)
          printf 'version=%s\nbuild_date=%s\ngit_commit=%s\ngit_branch=%s\njava_version=21\ngradle_version=%s\nos=%s\narch=%s\nimage=%s\n' \
            "$VERSION" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse --abbrev-ref HEAD)" \
            "$(./gradlew -q --version | grep ^Gradle | awk '{print $2}')" \
            "${{ matrix.os }}" \
            "${{ matrix.arch }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly" \
            > "$DIST_DIR/BUILD_INFO"

          # Create archive
          cd dist
          if [ "${{ matrix.package-ext }}" = "tar.gz" ]; then
            tar -czf "${{ matrix.artifact-name }}.tar.gz" "${{ matrix.artifact-name }}"
          else
            # windows zip
            7z a -tzip "${{ matrix.artifact-name }}.zip" "${{ matrix.artifact-name }}" >/dev/null
          fi

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.artifact-name }}.${{ matrix.package-ext }}
          retention-days: 1
          if-no-files-found: error

  # ============================================================
  # Job 3: Create Nightly Release (rolling tag=nightly, prerelease)
  # ============================================================
  nightly-release:
    name: Create Nightly Release
    needs: [test, build]
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all distribution artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: oddsmaker-server-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la dist/
          echo "Artifacts downloaded successfully"

      - name: Generate VERIFY.md (SHA256 checksums)
        run: |
          cd dist
          echo "# Oddsmaker Nightly Build - SHA256 Checksums" > VERIFY.md
          echo "" >> VERIFY.md
          echo "Build: nightly-$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> VERIFY.md
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> VERIFY.md
          echo "Commit: $(git rev-parse HEAD)" >> VERIFY.md
          echo "" >> VERIFY.md
          echo "| File | SHA256 |" >> VERIFY.md
          echo "|------|--------|" >> VERIFY.md
          for f in oddsmaker-server-*; do
            if [ -f "$f" ]; then
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "| $f | $sha |" >> VERIFY.md
            fi
          done
          cat VERIFY.md

      - name: Clean up old release assets (keep only current)
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null | xargs -I {} gh release delete-asset nightly {} --yes 2>/dev/null || true

      - name: Create/Update Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly Build $(date +%Y-%m-%d)"
          body_path: dist/VERIFY.md
          prerelease: true
          draft: false
          make_latest: false
          files: |
            dist/oddsmaker-server-*.tar.gz
            dist/oddsmaker-server-*.zip
            dist/VERIFY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (:nightly tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          labels: |
            org.opencontainers.image.title=Oddsmaker
            org.opencontainers.image.description=Gaming Analytics Platform (nightly)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max