# Oddsmaker Control Service - Release Workflow
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # 统一镜像（单镜像双服务，SERVICE=control|gateway），与 nightly-build.yml / Dockerfile 同口径
  IMAGE_NAME: ${{ github.repository_owner }}/oddsmaker
  JAVA_VERSION: '21'

jobs:
  # Job 1: Validate Release
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate version format
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

  # Job 2: Build and Test
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      # 走仓库 wrapper（不钉 gradle-version）：此前硬钉 8.7，Boot 4 插件要求 Gradle 8.14+，
      # 下次发版会在配置阶段直接失败（nightly Dockerfile 同款坑，28c3a20 修过 Dockerfile 侧）；
      # 且版本真源应为 wrapper，与 ci/nightly 同源。test 走全模块（与 ci/nightly 同口径）。
      - name: Run tests
        uses: gradle/gradle-build-action@v3.5.0
        with:
          arguments: |
            --no-daemon
            --stacktrace
            test

      - name: Build application
        uses: gradle/gradle-build-action@v3.5.0
        with:
          arguments: |
            --no-daemon
            :services:control-service:bootJar

      - name: Build Superset bundle asset
        run: |
          cd bi/superset
          ./build_bundle.sh || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: control-service-jar
          path: services/control-service/build/libs/*.jar

      - name: Upload Superset bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: superset-bundle
          path: bi/superset/playtics_dashboard_bundle.zip
          if-no-files-found: ignore

  # Job 3: Build and Push Docker Image
  # 版本 tag（<version>/<major.minor>/<major>/latest）与 nightly 的 :nightly 双轨：
  # 根 Dockerfile 自带 Gradle 多阶段构建，无需复用 build job 的 jar 产物
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Deploy to Production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, docker]  # 引用 needs.validate.outputs.version，须显式声明依赖
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.2.0
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      # DEPLOY-001 自动回滚前置：滚动前记录两服务当前运行镜像。首次发布时 deployment
      # 尚不存在，查询失败置空继续（|| true）——回滚脚本对空 prev 跳过并告警。
      - name: Record running images
        run: |
          set -euo pipefail
          prev_control=$(kubectl -n oddsmaker get deployment oddsmaker-control -o jsonpath='{.spec.template.spec.containers[?(@.name=="control-service")].image}' 2>/dev/null || true)
          prev_gateway=$(kubectl -n oddsmaker get deployment oddsmaker-gateway -o jsonpath='{.spec.template.spec.containers[?(@.name=="gateway-service")].image}' 2>/dev/null || true)
          echo "prev_control=${prev_control}" >> "$GITHUB_ENV"
          echo "prev_gateway=${prev_gateway}" >> "$GITHUB_ENV"

      # DEPLOY-001：Control 与 Gateway 同一发布契约——单镜像双服务用同一不可变版本
      # tag 同批滚动两个 deployment，防发布后版本漂移。
      # *-secrets.yaml（CHANGE_ME 占位凭据）由运维首次部署填真值后手工 apply 一次，
      # 本流水线不得 apply——再 apply 会用占位值覆盖产线真实凭据。
      # 任何一步失败（apply/set image/rollout 超时）都触发 ERR trap 自动回滚两服务。
      - name: Deploy to production
        run: |
          set -euo pipefail
          trap 'bash deploy/k8s/rollback-release.sh "$prev_control" "$prev_gateway"' ERR
          VERSION=${{ needs.validate.outputs.version }}
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/postgres.yaml
          kubectl apply -f deploy/k8s/redis.yaml
          kubectl apply -f deploy/k8s/control-service.yaml
          kubectl apply -f deploy/k8s/gateway-service.yaml
          kubectl set image deployment/oddsmaker-control control-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} -n oddsmaker
          kubectl set image deployment/oddsmaker-gateway gateway-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} -n oddsmaker
          kubectl rollout status deployment/oddsmaker-control -n oddsmaker --timeout=300s
          kubectl rollout status deployment/oddsmaker-gateway -n oddsmaker --timeout=300s

      # 健康检查在集群内做：exec 进 pod 用镜像自带 wget 打本机 actuator，不经过任何对外
      # 域名。ubuntu-latest runner 解析不了占位内网域名（原 curl 必挂），也不得为探活把
      # 管理端点暴露到公网。control 在 k8s 下经 MANAGEMENT_SERVER_PORT 把 actuator 迁到
      # 8086 管理口（/app/healthcheck.sh 按 SERVICE 选口只查 8085 app 口，此处不能复用），
      # gateway 单端口 8080。随后记录两服务实际运行镜像并与发布 tag 断言一致，滚动未完成
      # 或清单漂移即 fail——发布失败不会带绿 Release job（release needs: deploy）。
      # 健康断言失败同样触发 ERR trap 回滚：不能把 prod 卡在刚发布的坏版本上。
      - name: Verify deployment
        run: |
          set -euo pipefail
          trap 'bash deploy/k8s/rollback-release.sh "$prev_control" "$prev_gateway"' ERR
          VERSION=${{ needs.validate.outputs.version }}
          sleep 30
          kubectl -n oddsmaker exec deploy/oddsmaker-control -- wget -qO- --timeout=10 http://localhost:8086/actuator/health | grep -q '"status":"UP"'
          kubectl -n oddsmaker exec deploy/oddsmaker-gateway -- wget -qO- --timeout=10 http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          RUNNING=$(kubectl -n oddsmaker get deployment oddsmaker-control oddsmaker-gateway -o jsonpath='{range .items[*]}{.metadata.name}={.spec.template.spec.containers[0].image}{"\n"}{end}')
          echo "$RUNNING"
          echo "$RUNNING" | grep -qx "oddsmaker-control=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          echo "$RUNNING" | grep -qx "oddsmaker-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          echo "Production deployment successful: control + gateway @ ${VERSION}"

      # DEPLOY-001 执行项「部署后的验证增加真实事件采集冒烟测试」：Verify 步只证明 pod 活着、
      # 镜像正确，不证明采集入口按契约应答——gateway 若把 /v1/batch 全 401 掉，今天的发布照样绿。
      # 冒烟把 runner 经 kubectl port-forward 隧道打进集群，直击刚滚动的 gateway pod：
      #   1) 无凭据 POST      → 401 {"error":"missing_api_key"}（HmacFilter 在链上且生效）
      #   2) 伪造凭据 POST    → 401 {"error":"invalid_api_key"}（gateway→control 内部密钥查询链路通）
      # 任一不符即采集入口损坏，ERR trap 回滚。curl 在 runner 侧（pod 内 busybox wget 对 4xx 不吐
      # 响应体，断不了错误码）；隧道只开在本机 localhost，不经任何公网入口。伪造 key 带 run id，
      # 避开 AuthService 对不存在 key 的负缓存。
      #
      # 正向冒烟（真实事件被接受进发布链路）需要一枚可写冒烟密钥：仓库不持密钥，流水线也拿不到
      # AccessGuard 会话去发放，故 secret 门控——配好 SMOKE_API_KEY/SMOKE_API_SECRET/vars.SMOKE_GAME_ID
      # 才跑，未配置仅 ::warning:: 跳过（不静默失败、也不从库里捞生产密钥进流水线日志）。密钥须发放
      # 到 smoke 游戏的 dev 环境（key 级 rejectUnknownEvents 对 dev 豁免，冒烟不必先发 Schema）、
      # 允许写、带 HMAC secret。
      - name: Smoke ingest endpoint
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_API_SECRET: ${{ secrets.SMOKE_API_SECRET }}
          SMOKE_GAME_ID: ${{ vars.SMOKE_GAME_ID }}
        run: |
          set -euo pipefail
          trap 'bash deploy/k8s/rollback-release.sh "$prev_control" "$prev_gateway"' ERR
          kubectl -n oddsmaker port-forward deploy/oddsmaker-gateway 18080:8080 >/dev/null 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            curl -sf http://localhost:18080/actuator/health >/dev/null 2>&1 && break
            sleep 1
          done
          probe() {
            local expect_code="$1" expect_error="$2" out="$3" code
            shift 3
            code=$(curl -s -o "$out" -w '%{http_code}' -X POST http://localhost:18080/v1/batch -H 'Content-Type: application/json' "$@" -d '{}')
            if [ "$code" != "$expect_code" ]; then
              echo "::error::ingest probe expected HTTP ${expect_code} (${expect_error}), got ${code}: $(cat "$out")"
              return 1
            fi
            grep -q "$expect_error" "$out" || { echo "::error::ingest probe response missing '${expect_error}': $(cat "$out")"; return 1; }
          }
          probe 401 missing_api_key /tmp/smoke_nokey.json
          probe 401 invalid_api_key /tmp/smoke_badkey.json -H "x-api-key: smoke-invalid-${GITHUB_RUN_ID}"
          echo "Ingest smoke passed: unsigned and forged requests rejected by the deployed gateway"

          if [ -z "${SMOKE_API_KEY:-}" ] || [ -z "${SMOKE_API_SECRET:-}" ] || [ -z "${SMOKE_GAME_ID:-}" ]; then
            echo "::warning::positive ingest smoke skipped - set secrets.SMOKE_API_KEY/SMOKE_API_SECRET and vars.SMOKE_GAME_ID (write-capable smoke key on a smoke game, dev env) to assert real events are accepted"
            exit 0
          fi
          TS=$(date +%s)
          BODY=$(printf '{"events":[{"eventId":"smoke-%s","gameId":"%s","environment":"dev","eventType":"design","eventName":"release_smoke","deviceId":"smoke-device-%s","tsClient":%s}]}' "$TS" "$SMOKE_GAME_ID" "$TS" "$(date +%s000)")
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$SMOKE_API_SECRET" -hex | sed 's/^.* //')
          CODE=$(curl -s -o /tmp/smoke_positive.json -w '%{http_code}' -X POST http://localhost:18080/v1/batch -H 'Content-Type: application/json' -H "x-api-key: ${SMOKE_API_KEY}" -H "x-signature: t=${TS},s=${SIG}" -d "$BODY")
          if [ "$CODE" != "200" ]; then
            echo "::error::positive ingest smoke expected HTTP 200, got ${CODE}: $(cat /tmp/smoke_positive.json)"
            false
          fi
          if ! grep -q "smoke-${TS}" /tmp/smoke_positive.json; then
            echo "::error::positive ingest smoke: smoke event not in accepted list: $(cat /tmp/smoke_positive.json)"
            false
          fi
          echo "Positive ingest smoke passed: event smoke-${TS} accepted by the deployed gateway"

  # Job 5: Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: control-service-jar
          path: release/

      - name: Download Superset bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: superset-bundle
          path: release/
        continue-on-error: true

      - name: Pick release notes file
        id: pick
        run: |
          VER="${GITHUB_REF_NAME}"
          if [ -f "docs/release-notes/${VER}.md" ]; then
            echo "body=docs/release-notes/${VER}.md" >> $GITHUB_OUTPUT
          else
            echo "body=CHANGELOG.md" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            release/*.jar
            release/playtics_dashboard_bundle.zip
          body_path: ${{ steps.pick.outputs.body }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
