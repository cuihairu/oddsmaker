# 端到端验证编排（runner-docker 单机跑通基础链路）
# 中间件：postgres / redis / kafka / clickhouse / apicurio registry
# 应用：control-service / gateway-service（挂载宿主构建的 bootJar，temurin 21 运行）
# 用法：docker compose -f docker-compose.e2e.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: e2e-postgres
    environment:
      POSTGRES_DB: oddsmaker
      POSTGRES_USER: oddsmaker
      POSTGRES_PASSWORD: oddsmaker
    ports: ["15432:5432"]
    volumes:
      - e2e_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddsmaker"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [e2e]

  redis:
    image: redis:7-alpine
    container_name: e2e-redis
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [e2e]

  kafka:
    image: apache/kafka:3.7.0
    container_name: e2e-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [e2e]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: e2e-clickhouse
    environment:
      CLICKHOUSE_USER: oddsmaker
      CLICKHOUSE_PASSWORD: oddsmaker
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["18123:8123", "19000:9000"]
    volumes:
      - ../schema/sql/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../schema/sql/clickhouse/analytics.sql:/docker-entrypoint-initdb.d/02-analytics.sql:ro
      - ../schema/sql/clickhouse/ltv.sql:/docker-entrypoint-initdb.d/03-ltv.sql:ro
      - ../schema/sql/clickhouse/ml.sql:/docker-entrypoint-initdb.d/04-ml.sql:ro
      - ../schema/sql/clickhouse/crash.sql:/docker-entrypoint-initdb.d/05-crash.sql:ro
      - e2e_ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [e2e]

  apicurio:
    image: quay.io/apicurio/apicurio-registry-mem:2.6.5.Final
    container_name: e2e-apicurio
    ports: ["8081:8080"]
    environment:
      - QUARKUS_HTTP_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || wget -qO- http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [e2e]

  control-service:
    image: eclipse-temurin:21-jre
    container_name: e2e-control
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=70.0", "-jar", "/jars/control-service-0.1.0.jar"]
    volumes:
      - ./jars:/jars:ro
      - e2e_ctrl_data:/app/data
    ports: ["8085:8085", "8086:8086"]
    environment:
      # 双配置文件（application.yaml=H2 / application.yml=PG）打架，这里全部显式覆盖
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oddsmaker
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: oddsmaker
      SPRING_DATASOURCE_PASSWORD: oddsmaker
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
      CLICKHOUSE_USER: oddsmaker
      CLICKHOUSE_PASSWORD: oddsmaker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_REDIS_HOST: redis
      ODDSMAKER_ADMIN_TOKEN: e2e-admin-token
      ODDSMAKER_INTERNAL_TOKEN: e2e-internal-token
      ODDSMAKER_PLAYER_EXPORT_DIR: /app/data/player-exports
      SPRING_PROFILES_ACTIVE: e2e
      LOGGING_LEVEL_IO_ODDSMAKER: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"' || curl -fsS http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks: [e2e]

  gateway-service:
    image: eclipse-temurin:21-jre
    container_name: e2e-gateway
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=70.0", "-jar", "/jars/gateway-service-0.1.0.jar"]
    volumes:
      - ./jars:/jars:ro
    ports: ["18080:8080"]
    environment:
      ODDSMAKER_KAFKA_BOOTSTRAP: kafka:9092
      ODDSMAKER_KAFKA_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
      ODDSMAKER_CONTROL_URL: http://control-service:8085
      ODDSMAKER_CONTROL_INTERNAL_TOKEN: e2e-internal-token
      ODDSMAKER_AUTH_KEYS_E2EKEY: e2e-secret
      ODDSMAKER_KAFKA_TOPIC_EVENTS: oddsmaker.events_raw
      ODDSMAKER_KAFKA_TOPIC_RISK: oddsmaker.risk_events
    depends_on:
      kafka: { condition: service_healthy }
      apicurio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [e2e]

  events-enrich-job:
    image: eclipse-temurin:21-jre
    container_name: e2e-enrich
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=70.0",
              # Flink 1.19 在 Java 17+ 官方要求的模块开放（local executor 无启动脚本代劳）
              "--add-opens=java.base/java.lang=ALL-UNNAMED",
              "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
              "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
              "--add-opens=java.base/java.io=ALL-UNNAMED",
              "--add-opens=java.base/java.net=ALL-UNNAMED",
              "--add-opens=java.base/java.nio=ALL-UNNAMED",
              "--add-opens=java.base/java.util=ALL-UNNAMED",
              "--add-opens=java.base/java.util.concurrent=ALL-UNNAMED",
              "--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED",
              "-Dkafka.bootstrap=kafka:9092",
              "-Dregistry.url=http://apicurio:8080/apis/registry/v2",
              "-Dkafka.topic=oddsmaker.events_raw",
              "-Dkafka.dlq=oddsmaker.deadletter",
              "-Dclickhouse.url=jdbc:clickhouse://clickhouse:8123/default",
              "-Dclickhouse.user=oddsmaker",
              "-Dclickhouse.pass=oddsmaker",
              "-jar", "/jars/events-enrich-job-0.1.0-all.jar"]
    volumes:
      - ./jars:/jars:ro
    depends_on:
      kafka: { condition: service_healthy }
      apicurio: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    # local executor 无 REST/指标口，healthcheck 退化为 JVM 进程存活；
    # env.execute 抛异常时 JVM 退出、容器转 unhealthy，可被发现
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'events-enrich-job-0.1.0-all.jar' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [e2e]

  sessions-job:
    image: eclipse-temurin:21-jre
    container_name: e2e-sessions
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=70.0",
              # Flink 1.19 在 Java 17+ 官方要求的模块开放（local executor 无启动脚本代劳）
              "--add-opens=java.base/java.lang=ALL-UNNAMED",
              "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
              "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
              "--add-opens=java.base/java.io=ALL-UNNAMED",
              "--add-opens=java.base/java.net=ALL-UNNAMED",
              "--add-opens=java.base/java.nio=ALL-UNNAMED",
              "--add-opens=java.base/java.util=ALL-UNNAMED",
              "--add-opens=java.base/java.util.concurrent=ALL-UNNAMED",
              "--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED",
              "-Dkafka.bootstrap=kafka:9092",
              "-Dregistry.url=http://apicurio:8080/apis/registry/v2",
              "-Dkafka.topic=oddsmaker.events_raw",
              "-Dclickhouse.url=jdbc:clickhouse://clickhouse:8123/default",
              "-Dclickhouse.user=oddsmaker",
              "-Dclickhouse.pass=oddsmaker",
              # e2e 参数：session 窗口 1min、watermark 容差 0，让窗口在秒级验证内 fire
              # （生产默认 gap=30min、乱序容忍=10min，见 SessionsJob）
              "-Dsession.gap.minutes=1",
              "-Dwatermark.ooo.minutes=0",
              "-jar", "/jars/sessions-job-0.1.0-all.jar"]
    volumes:
      - ./jars:/jars:ro
    depends_on:
      kafka: { condition: service_healthy }
      apicurio: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sessions-job-0.1.0-all.jar' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [e2e]

volumes:
  e2e_pg_data:
  e2e_ch_data:
  e2e_ctrl_data:

networks:
  e2e:
    driver: bridge
