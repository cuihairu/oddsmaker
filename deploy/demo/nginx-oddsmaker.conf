# Oddsmaker 演示站点 nginx 配置
# 部署：cp 到 /etc/nginx/sites-available/oddsmaker.cuihairu.site && ln -s 到 sites-enabled
# 证书：certbot --nginx -d oddsmaker.cuihairu.site（Cloudflare 代理指向本机后执行；
#        CF 代理生效前可先用自签占位，CF Full 非 strict 模式可正常回源）

server {
    listen 80;
    server_name oddsmaker.cuihairu.site;

    # ACME HTTP-01 验证放行（certbot --nginx 会自动改写此块）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name oddsmaker.cuihairu.site;

    ssl_certificate     /etc/letsencrypt/live/oddsmaker.cuihairu.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddsmaker.cuihairu.site/privkey.pem;

    # Web 控制台（vue-router history 模式：未命中文件回退 index.html）
    root /opt/oddsmaker/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：不带路径的 proxy_pass 保留 /api 前缀，与 control 的 @RequestMapping("/api/**") 对齐
    location /api/ {
        proxy_pass http://127.0.0.1:38085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导出/榜单类接口偏慢；SSE 类响应关缓冲
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
