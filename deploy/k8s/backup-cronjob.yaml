# Backup CronJob for Oddsmaker PostgreSQL
---
# ConfigMap for backup script
apiVersion: v1
kind: ConfigMap
metadata:
  name: oddsmaker-backup-script
  namespace: oddsmaker
  labels:
    app: oddsmaker-backup
data:
  backup.sh: |
    #!/bin/bash
    set -e

    # Configuration
    BACKUP_DIR="${BACKUP_DIR:-/backup}"
    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="$BACKUP_DIR/postgres_$TIMESTAMP.sql.gz"

    mkdir -p "$BACKUP_DIR"

    # Perform backup（pg_dump 恒为全量逻辑备份；时间点恢复由 postgres WAL 归档承担）
    pg_dump -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME --format=custom --compress=9 --file=$BACKUP_FILE

    # Verify backup
    pg_restore --list "$BACKUP_FILE" > /dev/null 2>&1

    # Upload to S3 (if configured)。本 CronJob 镜像是 postgres:16-alpine，**不含 aws CLI**，
    # 故先判存在再传：否则 aws: not found 会被上面的 set -e 当成失败中止，
    # 连带下面的留存清理永不执行，备份 PVC 无界增长直到写满。
    # 离站状态显式化（审计 DR-001）：上传失败不中止清理（a0c1b9f 意图保留），
    # 但结尾 exit 2——离站缺口不得静默成功。0=本地+离站全成；1=本地校验失败；2=离站缺失。
    OFFSITE_STATUS="skipped"
    OFFSITE_REASON=""
    if [ -n "$S3_BUCKET" ]; then
      if command -v aws > /dev/null 2>&1; then
        if aws s3 cp "$BACKUP_FILE" s3://$S3_BUCKET/postgres/ --storage-class STANDARD_IA; then
          OFFSITE_STATUS="uploaded"
        else
          OFFSITE_STATUS="failed"
          OFFSITE_REASON="s3 upload error"
          echo "ERROR: S3 上传失败，离站副本缺失（本地备份保留在 $BACKUP_FILE）" >&2
        fi
      else
        OFFSITE_STATUS="failed"
        OFFSITE_REASON="aws CLI missing"
        echo "ERROR: S3_BUCKET=$S3_BUCKET 已配置但镜像内无 aws CLI，离站副本缺失（本地备份保留在 $BACKUP_FILE）" >&2
      fi
    fi

    # Clean up old backups（清理置于上传之后但不受上传成败牵连）
    find "$BACKUP_DIR" -name "*.sql.gz" -type f -mtime +$RETENTION_DAYS -delete

    if [ "$OFFSITE_STATUS" = "failed" ]; then
      echo "Backup finished with OFFSITE FAILURE ($OFFSITE_REASON): $BACKUP_FILE" >&2
      exit 2
    fi

    echo "Backup completed: $BACKUP_FILE"

---
# Secret for backup credentials
apiVersion: v1
kind: Secret
metadata:
  name: oddsmaker-backup-secrets
  namespace: oddsmaker
  labels:
    app: oddsmaker-backup
type: Opaque
stringData:
  DB_HOST: "oddsmaker-postgres"
  DB_PORT: "5432"
  DB_NAME: "oddsmaker"
  DB_USER: "oddsmaker"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  S3_BUCKET: "oddsmaker-backups"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"

---
# PersistentVolumeClaim for backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oddsmaker-backup-pvc
  namespace: oddsmaker
  labels:
    app: oddsmaker-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard

---
# CronJob for daily backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oddsmaker-postgres-backup
  namespace: oddsmaker
  labels:
    app: oddsmaker-backup
spec:
  schedule: "0 2 * * *"  # Daily at 2:00 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: oddsmaker-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/bash", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: oddsmaker-backup-secrets
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                - name: backup-storage
                  mountPath: /backup
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          volumes:
            - name: backup-script
              configMap:
                name: oddsmaker-backup-script
                defaultMode: 0755
            - name: backup-storage
              persistentVolumeClaim:
                claimName: oddsmaker-backup-pvc

---
# CronJob for weekly full backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oddsmaker-postgres-full-backup
  namespace: oddsmaker
  labels:
    app: oddsmaker-backup
spec:
  # 每周日 03:00 的保留副本：与每日档同走 pg_dump 全量逻辑备份，
  # 差异仅在错开时段（避免与日档 02:00 争抢同一备份卷），不再注入无接线效果的 BACKUP_TYPE。
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: oddsmaker-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/bash", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: oddsmaker-backup-secrets
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                - name: backup-storage
                  mountPath: /backup
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          volumes:
            - name: backup-script
              configMap:
                name: oddsmaker-backup-script
                defaultMode: 0755
            - name: backup-storage
              persistentVolumeClaim:
                claimName: oddsmaker-backup-pvc

---
# CronJob for Redis backup
# 经 redis-cli --rdb 网络流式导出，不挂载数据 PVC（RWO 卷只归 Redis 本体，
# 免同节点调度耦合与 BGSAVE 完成竞态）；留存按 backup-strategy.md §Redis 就地清理 7 天。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oddsmaker-redis-backup
  namespace: oddsmaker
  labels:
    app: oddsmaker-backup
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: oddsmaker-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: redis:7-alpine
              command:
                - /bin/sh
                - -c
                - |
                  redis-cli -h $REDIS_HOST -a $REDIS_PASSWORD --rdb /backup/redis_$(date +%Y%m%d_%H%M%S).rdb \
                    && find /backup -name "redis_*.rdb" -type f -mtime +7 -delete
              env:
                - name: REDIS_HOST
                  value: "oddsmaker-redis"
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: oddsmaker-redis-secrets
                      key: password
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: oddsmaker-backup-pvc
