# 仅首次部署手工使用：本文件是 CHANGE_ME 占位凭据，填入真实值后单独 apply 一次。
# 发布流水线（release.yaml）不得 apply 本文件——占位值覆盖即毁产线真实凭据。
# 对应清单：deploy/k8s/gateway-service.yaml（Deployment 经 secretRef 引用同名 Secret）。
apiVersion: v1
kind: Secret
metadata:
  name: oddsmaker-gateway-secrets
  namespace: oddsmaker
  labels:
    app: oddsmaker-gateway
    component: gateway-service
type: Opaque
stringData:
  # 网关访问控制面 /internal/* 的凭证（对应 oddsmaker.control.internal-token 与 oddsmaker.blocklist.internal-token）
  ODDSMAKER_INTERNAL_TOKEN: "CHANGE_ME_IN_PRODUCTION"
