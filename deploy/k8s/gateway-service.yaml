# Oddsmaker Gateway Service - Kubernetes Deployment
# 网关是公网事件采集入口：Ingress 提供平台级 HTTPS（TLS 由运维注入 secret）。
# 镜像与 control 同属 ghcr.io/cuihairu/oddsmaker 单镜像双服务，靠 SERVICE=gateway 区分。

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: oddsmaker-gateway-config
  namespace: oddsmaker
  labels:
    app: oddsmaker-gateway
    component: gateway-service
data:
  SERVICE: "gateway"
  ODDSMAKER_KAFKA_BOOTSTRAP: "kafka:9092"
  ODDSMAKER_KAFKA_REGISTRY_URL: "http://apicurio:8080/apis/registry/v2"
  ODDSMAKER_KAFKA_TOPIC_EVENTS: "oddsmaker.events_raw"
  ODDSMAKER_CONTROL_URL: "http://control-service:8085"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_IO_ODDSMAKER: "DEBUG"

---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: oddsmaker-gateway-secrets
  namespace: oddsmaker
  labels:
    app: oddsmaker-gateway
    component: gateway-service
type: Opaque
stringData:
  # 网关访问控制面 /internal/* 的凭证（对应 oddsmaker.control.internal-token 与 oddsmaker.blocklist.internal-token）
  ODDSMAKER_INTERNAL_TOKEN: "CHANGE_ME_IN_PRODUCTION"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oddsmaker-gateway
  namespace: oddsmaker
  labels:
    app: oddsmaker-gateway
    component: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oddsmaker-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: oddsmaker-gateway
        component: gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: oddsmaker-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway-service
          image: ghcr.io/cuihairu/oddsmaker:nightly
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: oddsmaker-gateway-config
            - secretRef:
                name: oddsmaker-gateway-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: oddsmaker-gateway
  namespace: oddsmaker
  labels:
    app: oddsmaker-gateway
    component: gateway-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: oddsmaker-gateway

---
# Ingress（平台级 HTTPS：证书由运维注入 oddsmaker-gateway-tls）
# 注意：不在 ingress 层加 rate-limit——网关是高频事件采集入口，
# 应用内 RateLimitFilter（per-apiKey rpm + per-ip ipRpm）才是权威限流面，
# ingress 100/min 会误伤采集流量。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oddsmaker-gateway
  namespace: oddsmaker
  labels:
    app: oddsmaker-gateway
    component: gateway-service
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ingest.oddsmaker.local
      secretName: oddsmaker-gateway-tls
  rules:
    - host: ingest.oddsmaker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oddsmaker-gateway
                port:
                  name: http

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oddsmaker-gateway
  namespace: oddsmaker
  labels:
    app: oddsmaker-gateway
    component: gateway-service
