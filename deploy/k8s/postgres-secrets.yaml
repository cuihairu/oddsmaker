# 仅首次部署手工使用：本文件是 CHANGE_ME 占位凭据，填入真实值后单独 apply 一次。
# 发布流水线（release.yaml）不得 apply 本文件——占位值覆盖即毁产线真实凭据。
# 对应清单：deploy/k8s/postgres.yaml（Deployment 经 secretKeyRef 引用同名 Secret）。
apiVersion: v1
kind: Secret
metadata:
  name: oddsmaker-postgres-secrets
  namespace: oddsmaker
  labels:
    app: oddsmaker-postgres
type: Opaque
stringData:
  username: "oddsmaker"
  password: "CHANGE_ME_IN_PRODUCTION"
