# PostgreSQL Deployment for Oddsmaker
---
# PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oddsmaker-postgres-pvc
  namespace: oddsmaker
  labels:
    app: oddsmaker-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# PersistentVolumeClaim for WAL archive（archive_command 目标，与数据卷分离便于独立留存与扩容）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oddsmaker-postgres-archive-pvc
  namespace: oddsmaker
  labels:
    app: oddsmaker-postgres
    component: wal-archive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oddsmaker-postgres
  namespace: oddsmaker
  labels:
    app: oddsmaker-postgres
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oddsmaker-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: oddsmaker-postgres
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          # WAL 归档：PITR 前置（deploy/backup/backup-strategy.md §PostgreSQL）
          # archive_command 建目录 + 写归档 PVC + 就地 30 天留存清理（单段归档后同一次 shell 内完成，
          # 不依赖第二个 pod 挂载 RWO 卷）；wal_archive_timeout=30s 保证 RPO ≤ 5 分钟
          args:
            - postgres
            - -c
            - archive_mode=on
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=3
            - -c
            - wal_archive_timeout=30s
            - -c
            - "archive_command=mkdir -p /var/lib/postgresql/archive && cp %p /var/lib/postgresql/archive/%f && find /var/lib/postgresql/archive -type f -mtime +30 -delete"
          env:
            - name: POSTGRES_DB
              value: "oddsmaker"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oddsmaker-postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oddsmaker-postgres-secrets
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - oddsmaker
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - oddsmaker
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-archive-storage
              mountPath: /var/lib/postgresql/archive
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: oddsmaker-postgres-pvc
        - name: postgres-archive-storage
          persistentVolumeClaim:
            claimName: oddsmaker-postgres-archive-pvc
        - name: init-scripts
          configMap:
            name: oddsmaker-postgres-init

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: oddsmaker-postgres
  namespace: oddsmaker
  labels:
    app: oddsmaker-postgres
    component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app: oddsmaker-postgres

---
# Secret
apiVersion: v1
kind: Secret
metadata:
  name: oddsmaker-postgres-secrets
  namespace: oddsmaker
  labels:
    app: oddsmaker-postgres
type: Opaque
stringData:
  username: "oddsmaker"
  password: "CHANGE_ME_IN_PRODUCTION"

---
# ConfigMap for init scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: oddsmaker-postgres-init
  namespace: oddsmaker
  labels:
    app: oddsmaker-postgres
data:
  01-init.sql: |
    -- Create extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- Grant permissions
    GRANT ALL PRIVILEGES ON DATABASE oddsmaker TO oddsmaker;
