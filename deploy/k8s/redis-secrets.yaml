# 仅首次部署手工使用：本文件是空凭据模板，填入真实值后单独 apply 一次。
# 留空时 redis-server --requirepass "" 会拒绝启动（fail-closed，不会带空/占位口令运行）。
# 发布流水线（release.yaml）不得 apply 本文件——占位值覆盖即毁产线真实凭据。
# 对应清单：deploy/k8s/redis.yaml（Deployment 经 secretKeyRef 引用同名 Secret）。
apiVersion: v1
kind: Secret
metadata:
  name: oddsmaker-redis-secrets
  namespace: oddsmaker
  labels:
    app: oddsmaker-redis
type: Opaque
stringData:
  password: ""
