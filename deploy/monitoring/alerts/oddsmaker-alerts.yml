# Oddsmaker Alerting Rules
groups:
  - name: oddsmaker-control-service
    rules:
      # Service availability
      - alert: OddsmakerControlServiceDown
        expr: up{job="oddsmaker-control"} == 0
        for: 1m
        labels:
          severity: critical
          service: control-service
        annotations:
          summary: "Oddsmaker Control Service is down"
          description: "The Oddsmaker Control Service has been down for more than 1 minute."

      # Gateway availability（审计 OBS-001 补缺：入口层原先无抓取 job 与存活告警）
      - alert: OddsmakerGatewayServiceDown
        expr: up{job="oddsmaker-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          service: gateway-service
        annotations:
          summary: "Oddsmaker Gateway Service is down"
          description: "The Oddsmaker Gateway Service (ingestion entry) has been down for more than 1 minute."

      # High error rate
      # 5xx 占比分母必须按 instance 聚合：分子携带 status 标签，若分母不聚合，
      # 除法按同标签集匹配会变成 5xx/5xx 恒等于 100%（任何 5xx 即误报）。
      - alert: HighErrorRate
        expr: |
          sum by (instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / sum by (instance) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
          service: control-service
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (above 5%)"

      # High latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
          service: control-service
        annotations:
          summary: "High latency detected"
          description: "P95 latency is {{ $value }}s (above 2s)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
          service: control-service
        annotations:
          summary: "High memory usage"
          description: "JVM heap usage is {{ $value | humanizePercentage }}"

      # High CPU usage
      - alert: HighCpuUsage
        expr: |
          process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
          service: control-service
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }}"

      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
          service: control-service
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Connection pool usage is {{ $value | humanizePercentage }}"

      # High database query time
      - alert: HighDatabaseQueryTime
        expr: |
          histogram_quantile(0.95, rate(hikaricp_connections_usage_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: control-service
        annotations:
          summary: "High database query time"
          description: "P95 query time is {{ $value }}s"

  - name: oddsmaker-database
    rules:
      # PostgreSQL down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been down for more than 1 minute."

      # High database connections
      - alert: HighDatabaseConnections
        expr: |
          pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High database connections"
          description: "Active connections: {{ $value }}"

      # Database replication lag
      - alert: DatabaseReplicationLag
        expr: |
          pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Database replication lag"
          description: "Replication lag is {{ $value }}s"

  - name: oddsmaker-cache
    rules:
      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute."

      # High memory usage（and 护栏：未配 maxmemory 时 max=0、used/max=+Inf，
      # 不许把「无内存上限配置」当成高内存误报——2026-10-20 对真实 redis-exporter
      # 活体验证揪出；无 maxmemory 属配置问题，应另行治理而非告警噪音）
      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
            and redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis high memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High eviction rate
      - alert: RedisHighEvictionRate
        expr: |
          rate(redis_evicted_keys_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis high eviction rate"
          description: "Eviction rate: {{ $value }}/s"

  - name: oddsmaker-messaging
    rules:
      # Kafka down
      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
          service: kafka
        annotations:
          summary: "Kafka is down"
          description: "Kafka has been down for more than 1 minute."

      # High consumer lag
      - alert: KafkaHighConsumerLag
        expr: |
          kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
          service: kafka
        annotations:
          summary: "Kafka high consumer lag"
          description: "Consumer lag: {{ $value }} messages"

  - name: oddsmaker-stream-processing
    rules:
      # Flink job manager down
      - alert: FlinkJobManagerDown
        expr: up{job="flink"} == 0
        for: 1m
        labels:
          severity: critical
          service: flink
        annotations:
          summary: "Flink Job Manager is down"
          description: "Flink Job Manager has been down for more than 1 minute."

      # Flink job failed
      - alert: FlinkJobFailed
        expr: |
          flink_jobmanager_job_uptime < 0
        for: 1m
        labels:
          severity: critical
          service: flink
        annotations:
          summary: "Flink job failed"
          description: "A Flink job has failed."

  # 分析库 ClickHouse（审计 OBS-001 观测面补缺：序列名对 24.8 原生 /metrics 逐名核对，
  # 2026-10-20 实跑 oddsmaker-clickhouse:9363 实证——ClickHouseProfileEvents_*/Metrics_*/
  # AsyncMetrics_* 三族）。compose 面 native 端点经根 compose 29363 端口抓取，
  # k8s 面同 job 名（k8s 清单 target 8123 需集群侧单独核）。
  - name: oddsmaker-analytics-db
    rules:
      # ClickHouse down
      - alert: ClickHouseDown
        expr: up{job="clickhouse"} == 0
        for: 1m
        labels:
          severity: critical
          service: clickhouse
        annotations:
          summary: "ClickHouse is down"
          description: "ClickHouse has been down for more than 1 minute."

      # Write failures (failed INSERT queries)
      - alert: ClickHouseWriteFailures
        expr: |
          rate(ClickHouseProfileEvents_FailedInsertQuery[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: clickhouse
        annotations:
          summary: "ClickHouse write failures"
          description: "Failed INSERT queries: {{ $value }} per second (over 5 minutes)."

      # High average query time
      # 平均查询耗时 = 总耗时增量 / 查询数增量（μs/queries）；Query 停流时分母为 0
      # 结果 NaN，比较恒 false，空转系统不误报。description 不嵌 $value：双 rate 相除
      # 带浮点噪声（4.0000000000000005e+06 之类），逐字模板断言会随实现抖动
      - alert: ClickHouseHighQueryTime
        expr: |
          rate(ClickHouseProfileEvents_QueryTimeMicroseconds[5m]) / rate(ClickHouseProfileEvents_Query[5m]) > 2000000
        for: 5m
        labels:
          severity: warning
          service: clickhouse
        annotations:
          summary: "ClickHouse high query time"
          description: "Average query time is above 2000000 microseconds (2 seconds)."

      # Disk space low (storage growth face)
      - alert: ClickHouseDiskSpaceLow
        expr: |
          ClickHouseAsyncMetrics_DiskAvailable_default / ClickHouseAsyncMetrics_DiskTotal_default < 0.15
        for: 5m
        labels:
          severity: warning
          service: clickhouse
        annotations:
          summary: "ClickHouse disk space low"
          description: "Free space on default disk below 15% ({{ $value | humanizePercentage }})."
