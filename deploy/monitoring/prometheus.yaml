# Prometheus Configuration for Oddsmaker
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting rules（必须写显式文件名，不得用 "alerts/*.yml"：promtool 单测文件
# oddsmaker-alerts.test.yml 与规则文件同目录，通配会把它当规则文件加载、配置直接
# 解析失败整栈拒起——2026-10-19 解阻塞复核才发现此回归，钉测试见
# services/control-service/.../deploy/AlertRulesContractTest#ruleFilesExcludeTheUnitTestFile）
rule_files:
  - "alerts/oddsmaker-alerts.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Oddsmaker Control Service
  - job_name: 'oddsmaker-control'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['oddsmaker-control:8086']
        labels:
          app: 'oddsmaker-control'
          component: 'control-service'
          environment: 'production'

  # Oddsmaker Gateway Service（k8s 面 Service oddsmaker-gateway:80 → 容器 8080；
  # actuator 与业务同端口。审计 OBS-001 补缺：入口层原先无抓取 job）
  - job_name: 'oddsmaker-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['oddsmaker-gateway:80']
        labels:
          app: 'oddsmaker-gateway'
          component: 'gateway-service'
          environment: 'production'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          app: 'oddsmaker-postgres'
          component: 'database'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          app: 'oddsmaker-redis'
          component: 'cache'

  # Kafka Exporter
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          app: 'oddsmaker-kafka'
          component: 'messaging'

  # ClickHouse
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
        labels:
          app: 'oddsmaker-clickhouse'
          component: 'analytics-db'

  # Flink
  - job_name: 'flink'
    static_configs:
      - targets: ['flink-jobmanager:9249']
        labels:
          app: 'oddsmaker-flink'
          component: 'stream-processing'

  # Node Exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: 'node-exporter'
