# Oddsmaker 快速启动编排（单镜像双服务 + 全依赖）
#
# 用法：
#   1. cp .env.example .env   # 复制并按需修改（端口/密码/Token 全部有中文注释）
#   2. docker compose -f docker-compose.quickstart.yml up -d
#   3. docker compose -f docker-compose.quickstart.yml ps   # 全部 healthy 即就绪
#
# 特点：
#   - 单镜像：ghcr.io/cuihairu/oddsmaker（含 control + gateway，SERVICE 环境变量选择）
#   - 非 root 运行、内置 healthcheck
#   - 端口组 3xxxx 避开本机常用端口冲突
#   - 卷持久化、depends_on 健康编排、中文注释

services:
  # PostgreSQL（control 的唯一 schema 真源是 Flyway 迁移，由 control 启动自动执行）
  postgres:
    image: postgres:16-alpine
    container_name: oddsmaker-postgres
    environment:
      TZ: UTC
      POSTGRES_DB: oddsmaker
      POSTGRES_USER: ${POSTGRES_USER:-oddsmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oddsmaker}
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oddsmaker}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - oddsmaker-network

  # Redis（会话/实时计数/风控短窗状态）
  redis:
    image: redis:7-alpine
    container_name: oddsmaker-redis
    ports:
      - "${REDIS_PORT:-36379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - oddsmaker-network

  # Kafka（KRaft 单节点；额外开 PLAINTEXT_HOST 供宿主脚本直连调试）
  kafka:
    image: apache/kafka:3.7.0
    container_name: oddsmaker-kafka
    ports:
      - "${KAFKA_PORT:-39092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - oddsmaker-network

  # 一次性建齐全部 topic（Flink source 启动即查 topic，不存在会直接退出）
  topic-init:
    image: apache/kafka:3.7.0
    container_name: oddsmaker-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in oddsmaker.events_raw oddsmaker.risk_events oddsmaker.identity_events oddsmaker.deadletter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        done
        echo "topics ready"
    networks:
      - oddsmaker-network

  # ClickHouse 24.8（表在 default 库；initdb 只在空卷首跑）
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: oddsmaker-clickhouse
    environment:
      TZ: UTC
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-oddsmaker}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-oddsmaker}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-38123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-39000}:9000"
    volumes:
      - ./schema/sql/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./schema/sql/clickhouse/analytics.sql:/docker-entrypoint-initdb.d/02-analytics.sql:ro
      - ./schema/sql/clickhouse/configurable-funnels-schema.sql:/docker-entrypoint-initdb.d/03-configurable-funnels.sql:ro
      - ./schema/sql/clickhouse/ltv.sql:/docker-entrypoint-initdb.d/04-ltv.sql:ro
      - ./schema/sql/clickhouse/ml.sql:/docker-entrypoint-initdb.d/05-ml.sql:ro
      - ./schema/sql/clickhouse/crash.sql:/docker-entrypoint-initdb.d/06-crash.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - oddsmaker-network

  # Avro Schema Registry（gateway 产出与 Flink job 消费 events_raw 都依赖）
  apicurio:
    image: quay.io/apicurio/apicurio-registry-mem:2.6.5.Final
    container_name: oddsmaker-apicurio
    ports:
      - "${APICURIO_PORT:-38081}:8080"
    environment:
      - QUARKUS_HTTP_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || wget -qO- http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - oddsmaker-network

  # Control Service（单镜像，SERVICE=control；schema 由 Flyway 启动迁移，ddl-auto=validate 校验）
  control-service:
    image: ${ODDSMAKER_IMAGE:-ghcr.io/cuihairu/oddsmaker:nightly}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oddsmaker-control-service
    ports:
      - "${CONTROL_PORT:-38085}:8085"
    environment:
      TZ: UTC
      SERVICE: control
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oddsmaker
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oddsmaker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-oddsmaker}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-oddsmaker}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-oddsmaker}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_REDIS_HOST: redis
      ODDSMAKER_ADMIN_TOKEN: ${ODDSMAKER_ADMIN_TOKEN:-dev-admin-token}
      ODDSMAKER_INTERNAL_TOKEN: ${ODDSMAKER_INTERNAL_TOKEN:-dev-internal-token}
      ODDSMAKER_PLAYER_EXPORT_DIR: /app/data/player-exports
      ODDSMAKER_FLINK_JARDIR: /jars
      LOGGING_LEVEL_IO_ODDSMAKER: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
    volumes:
      # Flink 作业 jar（本地构建时挂载；pull 镜像模式下可忽略）
      - ./deploy-rt/jars:/jars:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - oddsmaker-network

  # Gateway Service（单镜像，SERVICE=gateway；采集入口 → Kafka events_raw）
  gateway-service:
    image: ${ODDSMAKER_IMAGE:-ghcr.io/cuihairu/oddsmaker:nightly}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oddsmaker-gateway-service
    ports:
      - "${GATEWAY_PORT:-38080}:8080"
    environment:
      TZ: UTC
      SERVICE: gateway
      ODDSMAKER_KAFKA_BOOTSTRAP: kafka:9092
      ODDSMAKER_KAFKA_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
      ODDSMAKER_CONTROL_URL: http://control-service:8085
      ODDSMAKER_CONTROL_INTERNAL_TOKEN: ${ODDSMAKER_INTERNAL_TOKEN:-dev-internal-token}
      ODDSMAKER_AUTH_KEYS_DEVKEY: ${ODDSMAKER_AUTH_KEYS_DEVKEY:-dev-secret}
      ODDSMAKER_KAFKA_TOPIC_EVENTS: oddsmaker.events_raw
      ODDSMAKER_KAFKA_TOPIC_RISK: oddsmaker.risk_events
    depends_on:
      control-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      apicurio:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - oddsmaker-network

  # Superset（可选看板，需手动初始化管理员后使用）
  superset:
    image: apache/superset:3.1.0
    container_name: oddsmaker-superset
    ports:
      - "${SUPERSET_PORT:-38088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset-secret-key-change-in-production}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: User
      ADMIN_EMAIL: admin@oddsmaker.local
    volumes:
      - superset_data:/app/superset_home
    networks:
      - oddsmaker-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  superset_data:
    driver: local

networks:
  oddsmaker-network:
    driver: bridge