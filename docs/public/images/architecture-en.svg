<text x="60" y="550" class="body" text-anchor="start">Topics partitioned by game_id+environment</text>
<text x="60" y="590" class="small" text-anchor="start">JSON Schema + Avro governance</text>
<text x="60" y="616" class="small" text-anchor="start">Property allowlists · PII policy</text>
<text x="60" y="642" class="small" text-anchor="start">Event size limits</text>
