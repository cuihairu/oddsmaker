<text x="300" y="418" class="label" text-anchor="middle" style="fill:#2563eb">events into stream</text>
<text x="420" y="552" class="label" text-anchor="middle" style="fill:#2563eb">event stream →</text>
<text x="300" y="815" class="label" text-anchor="middle" style="fill:#7c3aed">analytics land</text>
<text x="900" y="815" class="label" text-anchor="middle" style="fill:#c2410c">risk state →</text>
<text x="300" y="962" class="label" text-anchor="middle" style="fill:#0891b2">control plane read/write</text>
<text x="60" y="1110" class="small" text-anchor="start">Observability: OpenTelemetry Collector + Prometheus + Grafana (infra/) · Models: oddsmaker_ml (churn / LTV / risk scoring, Python) · Dimension sync: dimension-sync-agent writes ClickHouse dimension tables</text>
<text x="60" y="1136" class="small" text-anchor="start">The logical boundary is uniformly game_id + environment; the environment expresses the release stage while physical routing is decided by storage_profile.</text>
<text x="60" y="1162" class="small" text-anchor="start">Solid: business data · Crossings without a dot are not connections</text>
</svg>
