<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Oddsmaker · System Architecture</title>
<desc id="desc">Real-time analytics and risk control platform for a single company running multiple games. SDK events pass gateway pre-validation into Kafka and the Schema Registry; Flink jobs enrich, dedupe, aggregate sessions, retention, funnels, risk detection and identity merge; analytics land in ClickHouse, risk writes Redis and calls back the game server webhook; the control plane writes PostgreSQL; BI runs Superset. Based on repository modules and deployment facts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.label{font-size:14px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.dash{stroke-dasharray:7 5}</style>
<rect width="1280" height="1180" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Oddsmaker · System Architecture</text>
<text x="40" y="80" class="body" text-anchor="start">Single company, multiple games · game_id + environment data boundary · real-time analytics and risk control on one pipeline</text>

