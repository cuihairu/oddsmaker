<text x="180" y="318" class="body" text-anchor="start">Pre-validation: API key / HMAC · time window · replay · rate limit · PII filtering · schema check · risk pre-check</text>
<text x="180" y="345" class="body" text-anchor="start">Events land on game_id + environment topics; physical routing is decided by storage_profile</text>
</g>

