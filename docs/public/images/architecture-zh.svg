<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Oddsmaker · 系统架构</title>
<desc id="desc">单公司多游戏实时分析与风控平台。SDK 事件经网关前置校验入 Kafka 与 Schema Registry，Flink 作业做富化去重、会话、留存、漏斗、风险检测与身份合并，分析结果落 ClickHouse，风险侧写 Redis 并回调游戏服 webhook；控制面写 PostgreSQL，BI 用 Superset。图示基于仓库模块与部署事实。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.label{font-size:14px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.dash{stroke-dasharray:7 5}</style>
<rect width="1280" height="1180" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Oddsmaker · 系统架构</text>
<text x="40" y="80" class="body" text-anchor="start">单公司多游戏 · game_id + environment 数据边界 · 实时分析 ＋ 风险控制同一管线</text>

<path d="M175 220 V250" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="sdk-web" data-from="sdk-web" data-to="gateway" d="M175 220 V250" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M485 220 V250" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="sdk-mobile" data-from="sdk-mobile" data-to="gateway" d="M485 220 V250" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M795 220 V250" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="sdk-unity" data-from="sdk-unity" data-to="gateway" d="M795 220 V250" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M1105 220 V250" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="sdk-server" data-from="sdk-server" data-to="gateway" d="M1105 220 V250" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M300 360 V400 H175 V430" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="gateway-kafka" data-from="gateway" data-to="kafka" d="M300 360 V400 H175 V430" class="edge" style="stroke:#2563eb;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M400 560 H440" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="kafka-flink" data-from="kafka" data-to="flink" d="M400 560 H440" class="edge" style="stroke:#2563eb;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M480 760 V800 H175 V830" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="flink-ch" data-from="flink" data-to="clickhouse" d="M480 760 V800 H175 V830" class="edge" style="stroke:#7c3aed;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M1067 680 V805 H795 V830" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="risk-redis" data-from="risk-job" data-to="redis" d="M1067 680 V805 H795 V830" class="edge" style="stroke:#c2410c;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M490 930 V955 H175 V980" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="control-pg" data-from="postgres" data-to="control" d="M490 930 V955 H175 V980" class="edge" style="stroke:#0891b2;stroke-width:2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M175 930 V955 H485 V980" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="ch-dashboard" data-from="clickhouse" data-to="dashboard" d="M175 930 V955 H485 V980" class="edge" style="stroke:#7c3aed;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M175 930 V945 H795 V980" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="ch-bi" data-from="clickhouse" data-to="bi" d="M175 930 V945 H795 V980" class="edge" style="stroke:#7c3aed;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M795 930 V955 H1105 V980" fill="none" stroke="#f8fafc" stroke-width="9"/>
