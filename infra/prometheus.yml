global:
  scrape_interval: 15s
  # 显式写评估间隔：告警规则靠它驱动（未写则默认同 scrape_interval）
  evaluation_interval: 15s

# 告警规则（审计 OBS-001 接线面补漏：本档此前只有抓取、18 条告警从未加载）：
# 与 k8s 面同一份规则文件；路径相对本配置文件目录解析（容器内
# /etc/prometheus/alerts/oddsmaker-alerts.yml，由 infra/docker-compose.yml 的
# alerts 卷挂载提供）。必须写显式文件名——单测文件 oddsmaker-alerts.test.yml
# 与规则文件同目录，用 "alerts/*.yml" 通配会把它当规则加载致解析失败。
# 本档没有 alertmanager 服务：规则在 prometheus 内评估，经 /api/v1/alerts 与
# Grafana 可观测；告警投递面在 k8s 形态（deploy/monitoring/prometheus.yaml 的
# alerting 段指向 alertmanager:9093）。
rule_files:
  - "alerts/oddsmaker-alerts.yml"

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']

  # 业务服务指标（审计 OBS-001 接线面）：本档 prometheus 与业务栈（仓库根 compose）分属
  # 两个 compose project，不共享网络；经 host.docker.internal(host-gateway) 抓根 compose
  # 已发布的宿主端口（control 28085→8085、gateway 28080→8080，actuator 与业务同端口，
  # management.endpoints.web.exposure 均含 prometheus）。
  # 前置：根 compose 业务栈在跑。docker < 20.10 无 host-gateway 映射，需升级。
  - job_name: 'oddsmaker-control'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:28085']
        labels:
          app: 'oddsmaker-control'
          component: 'control-service'

  - job_name: 'oddsmaker-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:28080']
        labels:
          app: 'oddsmaker-gateway'
          component: 'gateway-service'

  # 中间件 exporter（2026-10-20 审计 OBS-001 接线面补漏：规则引用 up{job=...} 的
  # postgres/redis/kafka 此前在本档无抓取面，PostgresDown/RedisDown/KafkaDown 及
  # 配套指标告警是死序列；k8s 面 job 名与此处严格一致，flink 例外见下）。
  # exporter 容器同 compose 网络，经 host.docker.internal 抓根 compose 已发布的
  # 宿主端口（25432→5432、26379→6379、29092→29092）。
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          app: 'oddsmaker-postgres'
          component: 'database'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          app: 'oddsmaker-redis'
          component: 'cache'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          app: 'oddsmaker-kafka'
          component: 'messaging'

  # 分析库 ClickHouse（2026-10-20 审计 OBS-001 观测面补缺）：根 compose 的 CH 以
  # config.d 开启原生 Prometheus 端点（deploy/monitoring/clickhouse/prometheus.xml，
  # 容器 9363 → 宿主 29363），此处经 host.docker.internal 直抓，job 名与 k8s 面一致。
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['host.docker.internal:29363']
        labels:
          app: 'oddsmaker-clickhouse'
          component: 'analytics-db'

  # flink 无本档抓取 job（根 compose 的 7 个 Flink 作业是 local executor 形态、
  # 无 JobManager 指标端点，DEPLOY-002；FlinkJobManagerDown/FlinkJobFailed 仅
  # k8s 面生效，集群化为独立后续工作）。钉测试
  # AlertRulesContractTest#alertScrapeJobsDefinedInMonitoringFaces 白名单豁免。
