[project]
name = "oddsmaker-ml"
version = "0.1.0"
description = "Oddsmaker 训练管线：churn / pltv / risk 可训练模型（对应 Java 侧 ChurnScorer / LtvForecastAssembler / RiskScorer 可解释启发式的可训练升级）"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oddsmaker-ml = "oddsmaker_ml.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oddsmaker_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
