server:
  port: 8085

spring:
  application:
    name: control-service

  # 数据库配置：PostgreSQL 为默认（与 deploy-rt 编排一致）。
  # 历史上本目录曾同时存在 application.yaml（H2）与 application.yml（PG），
  # 不同键的覆盖关系不确定、全靠环境变量压制；现已合并为这一个文件。
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oddsmaker}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:oddsmaker}
    password: ${DB_PASSWORD:oddsmaker}

  jpa:
    # Schema 唯一真源是 Flyway 迁移，validate 启动即校验实体↔表一致（漂移直接拒绝启动，
    # 防止 update/none 掩盖差异）。差异修复见 V0.8.7__align_jpa_schema.sql 及
    # test/.../tools/SchemaDiffExportTest（schema diff 导出工具）。
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # dialect 不显式指定：由 Hibernate 按连接自动检测（显式指定触发 HHH90000025 弃用警告）
        format_sql: true
        show_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 安全配置（Spring Boot 默认用户，供 actuator 等基础认证兜底）
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin123}

  # Kafka 配置 - 风控事件消费
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: control-service-risk
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000

  # @EnableScheduling 调度线程池：全部 @Scheduled 方法共享，防慢任务（导出/管道）饿死告警评估
  task:
    scheduling:
      pool:
        size: ${ODDSMAKER_SCHEDULER_POOL_SIZE:4}

# Oddsmaker 平台配置
oddsmaker:
  admin:
    # 管理令牌 - 生产环境必须更换
    token: ${ODDSMAKER_ADMIN_TOKEN:admin}
  internal:
    # Gateway 等服务间调用必须显式配置；留空时 /internal/** 默认拒绝。
    token: ${ODDSMAKER_INTERNAL_TOKEN:}
  auth:
    # 本地登录 JWT（HS256）签名密钥，>=32 字节；留空时 /api/** 仅 Admin Token 可用，
    # 控制面无法登录。初始账号 admin/admin123（V0.8.9 seed），生产必须更换。
    jwt-secret: ${ODDSMAKER_AUTH_JWT_SECRET:oddsmaker-dev-jwt-secret-0123456789abcdef0123456789abcdef}
    jwt-ttl-seconds: ${ODDSMAKER_AUTH_JWT_TTL_SECONDS:86400}

  company:
    # 单公司部署元信息
    name: ${ODDSMAKER_COMPANY_NAME:Oddsmaker Studio}
    deployment-id: ${ODDSMAKER_DEPLOYMENT_ID:local}
    default-timezone: ${ODDSMAKER_DEFAULT_TIMEZONE:Asia/Shanghai}
    data-region: ${ODDSMAKER_DATA_REGION:cn}

  # 邀请配置
  invitation:
    expire-hours: 72                   # 邀请链接72小时过期
    base-url: ${ODDSMAKER_BASE_URL:http://localhost:8085}

  # 安全配置
  security:
    jwt:
      secret: ${JWT_SECRET:oddsmaker-jwt-secret-key-change-in-production}
      expiration: 86400000             # 24小时 (毫秒)
    api-key:
      default-rotation-days: 90        # API密钥默认90天轮换
    password:
      min-length: 8
      require-special-chars: true
      require-numbers: true

  # ClickHouse（风控处置归档 + 大屏指标查询；留空时相关功能降级为不可用）
  clickhouse:
    url: ${CLICKHOUSE_URL:}
    user: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}

  # 玩家数据导出（P4）：文件落盘目录与保留时长（到期 cleanup 删除）
  player-export:
    storage-dir: ${ODDSMAKER_PLAYER_EXPORT_DIR:data/player-exports}
    retention-hours: ${ODDSMAKER_PLAYER_EXPORT_RETENTION_HOURS:72}

  # 业务指标告警：DAU/收入/崩溃率的阈值或同比偏差规则，定时评估后发站内告警 + Webhook
  metric-alert:
    enabled: ${ODDSMAKER_METRIC_ALERT_ENABLED:true}
    cron: ${ODDSMAKER_METRIC_ALERT_CRON:0 */10 * * * *}

  # 玩家数据删除请求（GDPR erasure）：标识展开上限、僵尸重置、CH mutation 轮询与重试
  erasure:
    identity-expansion-limit: ${ODDSMAKER_ERASURE_EXPANSION_LIMIT:500}
    processing-timeout-minutes: ${ODDSMAKER_ERASURE_PROCESSING_TIMEOUT_MINUTES:60}
    mutation-timeout-seconds: ${ODDSMAKER_ERASURE_MUTATION_TIMEOUT_SECONDS:300}
    mutation-poll-interval-seconds: ${ODDSMAKER_ERASURE_MUTATION_POLL_SECONDS:5}
    max-ch-retries: ${ODDSMAKER_ERASURE_MAX_CH_RETRIES:8}

  # 健康监控的模拟数据开关：@EnableScheduling 激活后默认关闭，
  # 避免 Math.random 假指标/假告警污染真实监控数据（本地演示可显式开启）
  health:
    simulated-metrics-enabled: ${ODDSMAKER_HEALTH_SIMULATED_METRICS:false}
    simulated-checks-enabled: ${ODDSMAKER_HEALTH_SIMULATED_CHECKS:false}

# 监控和健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  level:
    io.oddsmaker: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oddsmaker_control}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:oddsmaker_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate               # 生产环境不自动修改表结构
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    show-sql: false

logging:
  level:
    io.oddsmaker: INFO                       # 生产环境标准日志级别
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/oddsmaker/control-service.log

---
# 测试环境配置（H2 内存库，配合 SPRING_PROFILES_ACTIVE=test 使用；H2 为 runtimeOnly 依赖）
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop            # 测试环境每次重新创建表
    properties:
      hibernate:
        format_sql: true
        show_sql: true

logging:
  level:
    io.oddsmaker: DEBUG
    org.springframework.security: DEBUG
