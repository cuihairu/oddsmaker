server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    # histogram_quantile 类告警（HighLatency 覆盖 gateway 实例）依赖 _bucket 序列；
    # micrometer 默认只导出 summary（无 bucket），真实 exposition 无此序列时告警
    # 永不触发（2026-10-20 实证，见审计 OBS-001）。钉测试见
    # AlertRulesContractTest#bucketMetricsHavePercentileHistogramsEnabled。
    distribution:
      percentiles-histogram:
        http.server.requests: true

oddsmaker:
  kafka:
    bootstrap: localhost:9092
    topic:
      events: oddsmaker.events_raw
    registry-url: http://localhost:8081/apis/registry/v2
    dlq-topic: oddsmaker.deadletter
    producer:
      linger-ms: 5
      batch-size: 65536
  auth:
    # 测试密钥对在 src/test/resources/application.yaml，主配置不携带（生产用数据库/控制面）
  ratelimit:
    rpm: 600          # per api key per minute
    ip-rpm: 300        # per client IP per minute
  control:
    url: http://localhost:8085
    internal-token: ${ODDSMAKER_INTERNAL_TOKEN:}
  blocklist:
    enabled: true
    internal-token: ${ODDSMAKER_INTERNAL_TOKEN:}
    timeout-ms: 200
    cache-ttl-seconds: 15
  dataquality:
    reporting-enabled: true   # 60s 快照 POST control /internal/data-quality；未配 control.internal-token 时自动静默
  props:
    allowlist: []   # 示例: [level,stars,amount,currency,exp,variant]
  event:
    max-bytes: 65536
  request:
    max-bytes: 1048576
  pii:
    email: mask      # mask|drop|allow
    phone: mask      # mask|drop|allow
    ip: coarse       # coarse|drop|allow  (coarse: IPv4 /24, IPv6 /48)
    deny-keys: [password, pass, passwd, credit_card, ssn]
    mask-keys: [email, phone, mobile]
